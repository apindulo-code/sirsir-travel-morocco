name = "sirsir-travel-morocco-ai"
main = "src/index.js"
compatibility_date = "2026-11-16"

[vars]
FIREBASE_PROJECT_ID = "sirsir-travel-morocco"
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_TIMEOUT_MS = "30000"
# Keep browser access closed until the real SirSir web app origin is verified.
# Native Android requests without an Origin header remain supported.
ALLOWED_ORIGIN = ""

# IDs are derived from this Firebase project number to avoid generic example IDs.
# Confirm they are unused in this Cloudflare account before deployment.
[[ratelimits]]
name = "EDGE_LIMITER"
namespace_id = "8810465336481"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "8810465336482"
simple = { limit = 1, period = 60 }
