name: Build Android APK

concurrency:
  group: sirsir-travel-morocco-release-v2
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create --platforms=android,web --project-name=sirsir_travel_morocco .

      - name: Configure Android package ID, launcher and permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          package_id = 'ma.sirsirtravel.morocco'
          gradle_files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file not found')
          lines = gradle.read_text().splitlines()
          found_namespace = found_application_id = False
          for index, line in enumerate(lines):
              if line.strip().startswith('namespace ='):
                  lines[index] = f'    namespace = "{package_id}"'
                  found_namespace = True
              elif line.strip().startswith('applicationId ='):
                  lines[index] = f'        applicationId = "{package_id}"'
                  found_application_id = True
          if not found_namespace or not found_application_id:
              raise SystemExit(f'Could not safely set Android package ID (namespace={found_namespace}, applicationId={found_application_id})')
          gradle.write_text('\n'.join(lines) + '\n')

          # Android resolves ".MainActivity" against the Gradle namespace.
          # Move the generated launcher class into that exact package.
          root = Path('android/app/src/main')
          candidates = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one MainActivity source, found {len(candidates)}')
          source_file = candidates[0]
          source_lines = source_file.read_text().splitlines()
          package_indexes = [i for i, line in enumerate(source_lines) if line.strip().startswith('package ')]
          if len(package_indexes) != 1:
              raise SystemExit(f'Expected one package declaration in {source_file}')
          source_lines[package_indexes[0]] = f'package {package_id}'
          language_dir = 'kotlin' if source_file.suffix == '.kt' else 'java'
          target = Path('android/app/src/main') / language_dir / Path(*package_id.split('.')) / source_file.name
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(source_lines) + '\n')
          if source_file != target:
              source_file.unlink()
          print(f'MainActivity package aligned: {target}')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          # Give Android the public product name instead of the internal Flutter project slug.
          import re
          source, label_count = re.subn(
              r'(<application\b[^>]*\bandroid:label=")[^"]*(")',
              r'\1SirSir Travel Morocco\2',
              source,
              count=1,
          )
          if label_count == 0:
              source, label_count = re.subn(
                  r'<application\b',
                  '<application android:label="SirSir Travel Morocco"',
                  source,
                  count=1,
              )
          if label_count != 1:
              raise SystemExit('Could not safely set Android application label')
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          source = source.replace('    <application', permissions + '    <application', 1)
          manifest.write_text(source)
          print('Android app label set to SirSir Travel Morocco')
          PY

      - name: Configure Android upload signing (only when secrets are configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_STORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ANDROID_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "::notice::Android signing secrets are not configured. APK/web checks will run; signed AAB will be skipped."
            exit 0
          fi

          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties android/app/upload-keystore.jks

          echo "Public upload-certificate fingerprints (safe to add in Firebase):"
          keytool -exportcert -keystore android/app/upload-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" | openssl dgst -sha1
          keytool -exportcert -keystore android/app/upload-keystore.jks -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_STORE_PASSWORD" | openssl dgst -sha256

          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle.kts')
          if gradle.exists():
              source = gradle.read_text()
              if 'signingConfigs {' not in source:
                  android_marker = 'android {'
                  if android_marker not in source:
                      raise SystemExit('Android Gradle Kotlin DSL android block not found')
                  imports = "import java.util.Properties\nimport java.io.FileInputStream\n\n"
                  if "import java.util.Properties" not in source:
                      source = imports + source
                  properties = """    val keystoreProperties = Properties()
              val keystorePropertiesFile = rootProject.file("key.properties")
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(FileInputStream(keystorePropertiesFile))
              }

          """
                  source = source.replace(android_marker, android_marker + '\n' + properties, 1)
                  signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
                  source = source.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  match = re.search(r'buildTypes\s*\{', source)
                  if not match:
                      raise SystemExit('Android buildTypes block not found')
                  before, tail = source[:match.end()], source[match.end():]
                  tail, count = re.subn(
                      r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                      'signingConfig = signingConfigs.getByName("release")',
                      tail,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('Could not safely replace generated debug release signing config')
                  source = before + tail
              gradle.write_text(source)
          else:
              gradle = Path('android/app/build.gradle')
              if not gradle.exists():
                  raise SystemExit('Android app Gradle file not found')
              source = gradle.read_text()
              if 'signingConfigs {' not in source:
                  properties = """    def keystoreProperties = new Properties()
              def keystorePropertiesFile = rootProject.file('key.properties')
              if (keystorePropertiesFile.exists()) {
                  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
              }

          """
                  source = source.replace('android {', 'android {\n' + properties, 1)
                  signing = """    signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
                  source = source.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  match = re.search(r'buildTypes\s*\{', source)
                  if not match:
                      raise SystemExit('Android buildTypes block not found')
                  before, tail = source[:match.end()], source[match.end():]
                  tail, count = re.subn(
                      r'signingConfig\s*(?:=\s*)?signingConfigs\.debug',
                      'signingConfig signingConfigs.release',
                      tail,
                      count=1,
                  )
                  if count != 1:
                      raise SystemExit('Could not safely replace generated debug release signing config')
                  source = before + tail
              gradle.write_text(source)
          print('Android release signing configured without printing secret values.')
          PY

          echo "ANDROID_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter source
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

      - name: Build release APK
        timeout-minutes: 20
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build signed Android App Bundle for Google Play
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        timeout-minutes: 25
        run: flutter build appbundle --release

      - name: Upload signed Android App Bundle
        if: env.ANDROID_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-google-play-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Build responsive web app
        run: flutter build web --release

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-web
          path: build/web/
          if-no-files-found: error


      # Keep deliverables available even if the emulator smoke test is slow or fails.
      - name: Verify Android app launch on emulator
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          # The action runs scripts with /bin/sh; invoke Bash explicitly for pipefail compatibility.
          script: bash -c 'timeout --signal=TERM --kill-after=10s 8m flutter test integration_test/app_launch_test.dart --reporter expanded'

      - name: Capture emulator diagnostics after launch-test failure
        if: failure()
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p build/emulator-diagnostics
          timeout 15s adb devices -l > build/emulator-diagnostics/adb-devices.txt 2>&1 || true
          timeout 30s adb logcat -d -t 1000 > build/emulator-diagnostics/logcat.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity activities > build/emulator-diagnostics/activities.txt 2>&1 || true
          timeout 20s adb shell dumpsys package ma.sirsirtravel.morocco > build/emulator-diagnostics/package.txt 2>&1 || true

      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-emulator-diagnostics-${{ github.run_number }}
          path: build/emulator-diagnostics/
          if-no-files-found: warn
          retention-days: 7
