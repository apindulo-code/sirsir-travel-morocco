name: Build Android APK

concurrency:
  group: sirsir-travel-morocco-release
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create --platforms=android,web --project-name=sirsir_travel_morocco .

      - name: Configure Android package ID, launcher and permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          package_id = 'ma.sirsirtravel.morocco'
          gradle_files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file not found')
          lines = gradle.read_text().splitlines()
          found_namespace = found_application_id = False
          for index, line in enumerate(lines):
              if line.strip().startswith('namespace ='):
                  lines[index] = f'    namespace = "{package_id}"'
                  found_namespace = True
              elif line.strip().startswith('applicationId ='):
                  lines[index] = f'        applicationId = "{package_id}"'
                  found_application_id = True
          if not found_namespace or not found_application_id:
              raise SystemExit(f'Could not safely set Android package ID (namespace={found_namespace}, applicationId={found_application_id})')
          gradle.write_text('\n'.join(lines) + '\n')

          # Android resolves ".MainActivity" against the Gradle namespace.
          # Move the generated launcher class into that exact package.
          root = Path('android/app/src/main')
          candidates = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one MainActivity source, found {len(candidates)}')
          source_file = candidates[0]
          source_lines = source_file.read_text().splitlines()
          package_indexes = [i for i, line in enumerate(source_lines) if line.strip().startswith('package ')]
          if len(package_indexes) != 1:
              raise SystemExit(f'Expected one package declaration in {source_file}')
          source_lines[package_indexes[0]] = f'package {package_id}'
          language_dir = 'kotlin' if source_file.suffix == '.kt' else 'java'
          target = Path('android/app/src/main') / language_dir / Path(*package_id.split('.')) / source_file.name
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('\n'.join(source_lines) + '\n')
          if source_file != target:
              source_file.unlink()
          print(f'MainActivity package aligned: {target}')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          source = source.replace('    <application', permissions + '    <application', 1)
          manifest.write_text(source)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Build responsive web app
        run: flutter build web --release

      - name: Upload web app
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-web
          path: build/web/
          if-no-files-found: error
