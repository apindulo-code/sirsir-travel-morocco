name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create --platforms=android,web --project-name=sirsir_travel_morocco .

      - name: Configure Android package ID, location and internet permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          package_id = 'ma.sirsirtravel.morocco'
          gradle_files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file not found')
          source_gradle = gradle.read_text()
          lines = source_gradle.splitlines()
          found_namespace = found_application_id = False
          for index, line in enumerate(lines):
              if line.strip().startswith('namespace ='):
                  lines[index] = f'    namespace = "{package_id}"'
                  found_namespace = True
              elif line.strip().startswith('applicationId ='):
                  lines[index] = f'        applicationId = "{package_id}"'
                  found_application_id = True
          if not found_namespace or not found_application_id:
              raise SystemExit(f'Could not safely set Android package ID (namespace={found_namespace}, applicationId={found_application_id})')
          source_gradle = '\n'.join(lines) + '\n'
          gradle.write_text(source_gradle)
          PY
          # Keep the Android launcher class in the same package as the manifest namespace.
          python - <<'PY'
          from pathlib import Path
          import re
          package_id = 'ma.sirsirtravel.morocco'
          root = Path('android/app/src/main')
          candidates = list(root.rglob('MainActivity.kt')) + list(root.rglob('MainActivity.java'))
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one MainActivity source, found {len(candidates)}')
          source_file = candidates[0]
          source = source_file.read_text()
          updated, count = re.subn(r'(?m)^package\\s+[A-Za-z0-9_.]+\\s*
          source = manifest.read_text()
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          source = source.replace('    <application', permissions + '    <application', 1)
          manifest.write_text(source)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
, f'package {package_id}', source, count=1)
          if count != 1:
              raise SystemExit(f'Could not update MainActivity package in {source_file}')
          suffix = source_file.suffix
          language_dir = 'kotlin' if suffix == '.kt' else 'java'
          target = Path('android/app/src/main') / language_dir / Path(*package_id.split('.')) / source_file.name
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(updated)
          if source_file != target:
              source_file.unlink()
          print(f'MainActivity package aligned: {target}')
          PY
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          source = source.replace('    <application', permissions + '    <application', 1)
          manifest.write_text(source)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
