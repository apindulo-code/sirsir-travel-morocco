name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Flutter platform files
        run: flutter create --platforms=android,web --project-name=sirsir_travel_morocco .

      - name: Configure Android package ID, location and internet permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          package_id = 'ma.sirsirtravel.morocco'
          gradle_files = [Path('android/app/build.gradle.kts'), Path('android/app/build.gradle')]
          gradle = next((p for p in gradle_files if p.exists()), None)
          if gradle is None:
              raise SystemExit('Android app Gradle file not found')
          source_gradle = gradle.read_text()
          source_gradle, ns_count = re.subn(r'namespace\\s*=\\s*[\"\\'][^\"\\']+[\"\\']', f'namespace = "{package_id}"', source_gradle, count=1)
          source_gradle, app_count = re.subn(r'applicationId\\s*=\\s*[\"\\'][^\"\\']+[\"\\']', f'applicationId = "{package_id}"', source_gradle, count=1)
          if ns_count != 1 or app_count != 1:
              raise SystemExit(f'Could not safely set Android package ID (namespace={ns_count}, applicationId={app_count})')
          gradle.write_text(source_gradle)
          PY
          python - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          permissions = '    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n'
          source = source.replace('    <application', permissions + '    <application', 1)
          manifest.write_text(source)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sirsir-travel-morocco-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
