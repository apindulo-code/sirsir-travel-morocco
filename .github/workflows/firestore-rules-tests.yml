name: Firestore Security Rules Tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Test Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore Emulator security tests
        run: npx firebase emulators:exec --project demo-sirsir-travel-morocco --only firestore "npm test"
