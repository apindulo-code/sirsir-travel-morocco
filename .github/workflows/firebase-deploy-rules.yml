name: Deploy Firebase Firestore Rules

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIRSIR_TRAVEL_MOROCCO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT_SIRSIR_TRAVEL_MOROCCO repository secret before running this workflow."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SIRSIR_TRAVEL_MOROCCO }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project sirsir-travel-morocco --non-interactive
