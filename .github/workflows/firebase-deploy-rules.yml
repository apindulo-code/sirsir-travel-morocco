name: Deploy Firebase Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/881046533648/locations/global/workloadIdentityPools/sirsir-github/providers/github
          service_account: sirsir-github-deploy@sirsir-travel-morocco.iam.gserviceaccount.com

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project sirsir-travel-morocco --non-interactive
