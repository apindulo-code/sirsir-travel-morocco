name: Test Google Cloud Workload Identity

"on":
  workflow_dispatch:
  push:
    branches:
      - main
      - security/use-least-privilege-wif-account

permissions:
  contents: read

jobs:
  verify-authentication:
    name: Verify GitHub to Google Cloud authentication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without service-account keys
        uses: google-github-actions/auth@v3
        with:
          project_id: sirsir-travel-morocco
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          # Use the same dedicated, least-privilege identity as the Firestore deploy workflow.
          service_account: sirsir-github-deploy@sirsir-travel-morocco.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated identity
        shell: bash
        run: |
          set -euo pipefail
          expected_identity="sirsir-github-deploy@sirsir-travel-morocco.iam.gserviceaccount.com"
          active_identity="$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          echo "Authenticated identity: ${active_identity}"
          if [[ "${active_identity}" != "${expected_identity}" ]]; then
            echo "::error::Expected ${expected_identity}, but authenticated as ${active_identity:-<none>}."
            exit 1
          fi
          gcloud config set project sirsir-travel-morocco
          gcloud auth print-access-token >/dev/null
          echo "Google Cloud authentication succeeded. No Firebase deployment was performed."

      - name: Verify manual deployment workflow uses the same dedicated identity
        shell: bash
        run: |
          set -euo pipefail
          expected_identity="sirsir-github-deploy@sirsir-travel-morocco.iam.gserviceaccount.com"
          configured_identity="$(python3 - <<'PY'
          import re
          from pathlib import Path

          workflow = Path(".github/workflows/deploy-firestore-rules.yml").read_text()
          identities = re.findall(r"^\s*service_account:\s*(\S+)\s*$", workflow, re.MULTILINE)
          if len(identities) != 1:
              raise SystemExit(f"Expected exactly one service_account entry, found {len(identities)}")
          print(identities[0])
          PY
          )"
          if [[ "${configured_identity}" != "${expected_identity}" ]]; then
            echo "::error::Manual deploy workflow identity mismatch: ${configured_identity}"
            exit 1
          fi
          echo "Manual Firestore deployment uses the verified dedicated identity."

      - name: Inspect Firebase backend resources (read-only)
        continue-on-error: true
        shell: bash
        run: |
          echo "Checking whether the Firestore API is enabled..."
          if gcloud services list --enabled --project sirsir-travel-morocco --filter="config.name=firestore.googleapis.com" --format="value(config.name)" | grep -q "firestore.googleapis.com"; then
            echo "Firestore API is enabled."
          else
            echo "Firestore API is disabled or the service account cannot inspect service activation."
          fi

          echo "Checking the default Firestore database..."
          if gcloud firestore databases describe --database="(default)" --project sirsir-travel-morocco --format="yaml(name,type,locationId)"; then
            echo "Default Firestore database is accessible."
          else
            echo "Default Firestore database is not available yet, or the service account lacks read permission."
          fi

      - name: Verify Firebase APIs and Firestore database (read-only)
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for api in firestore.googleapis.com identitytoolkit.googleapis.com; do
            if gcloud services list --enabled --project=sirsir-travel-morocco --filter="config.name=$api" --format="value(config.name)" | grep -q "$api"; then
              echo "$api: ENABLED"
            else
              echo "$api: NOT ENABLED or not visible to this service account"
            fi
          done

          echo "Checking default Firestore database..."
          gcloud firestore databases describe --database="(default)" --project=sirsir-travel-morocco --format="yaml(name,type,locationId)"
