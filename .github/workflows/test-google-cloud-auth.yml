name: Test Google Cloud Workload Identity

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-authentication:
    name: Verify GitHub to Google Cloud authentication
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without service-account keys
        uses: google-github-actions/auth@v3
        with:
          project_id: sirsir-travel-morocco
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify authenticated identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          gcloud config set project sirsir-travel-morocco
          gcloud auth print-access-token >/dev/null
          echo "Google Cloud authentication succeeded. No Firebase deployment was performed."

      - name: Inspect Firebase backend resources (read-only)
        continue-on-error: true
        shell: bash
        run: |
          echo "Checking whether the Firestore API is enabled..."
          if gcloud services list --enabled --project sirsir-travel-morocco --filter="config.name=firestore.googleapis.com" --format="value(config.name)" | grep -q "firestore.googleapis.com"; then
            echo "Firestore API is enabled."
          else
            echo "Firestore API is disabled or the service account cannot inspect service activation."
          fi

          echo "Checking the default Firestore database..."
          if gcloud firestore databases describe --database="(default)" --project sirsir-travel-morocco --format="yaml(name,type,locationId)"; then
            echo "Default Firestore database is accessible."
          else
            echo "Default Firestore database is not available yet, or the service account lacks read permission."
          fi

      - name: Enable Firebase APIs if authorized (no database creation)
        continue-on-error: true
        shell: bash
        run: |
          gcloud services enable firestore.googleapis.com identitytoolkit.googleapis.com --project=sirsir-travel-morocco
