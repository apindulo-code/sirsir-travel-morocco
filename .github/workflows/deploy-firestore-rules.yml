name: Deploy Firestore Security Rules

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-firestore-rules-deploy
  cancel-in-progress: false

jobs:
  deploy-firestore-rules:
    name: Test and deploy Firestore rules manually
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Firestore rules test dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore Emulator security tests before deployment
        run: npx firebase emulators:exec --project demo-sirsir-travel-morocco --only firestore "npm test"

      - name: Authenticate to Google Cloud without service-account keys
        uses: google-github-actions/auth@v3
        with:
          project_id: sirsir-travel-morocco
          workload_identity_provider: projects/881046533648/locations/global/workloadIdentityPools/sirsir-github/providers/github
          service_account: sirsir-github-deploy@sirsir-travel-morocco.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project sirsir-travel-morocco --non-interactive
