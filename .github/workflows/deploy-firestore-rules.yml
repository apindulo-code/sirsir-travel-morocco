name: Deploy Firestore Security Rules

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-firestore-rules:
    name: Deploy tested Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud without service-account keys
        uses: google-github-actions/auth@v3
        with:
          project_id: sirsir-travel-morocco
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Deploy Firestore security rules
        run: firebase deploy --only firestore:rules --project sirsir-travel-morocco --non-interactive
